<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ultimate Football 2027</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#07111c;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}

#game{
 position:fixed;
 inset:0;
}

canvas{display:block}

#hud{
 position:absolute;
 top:12px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 align-items:center;
 gap:18px;
 background:#061421e8;
 border:1px solid #ffffff40;
 border-radius:12px;
 padding:12px 20px;
 z-index:5;
}

.team{
 font-weight:bold;
 font-size:15px;
}

.score{
 font-size:26px;
 font-weight:900;
}

#timer{
 font-size:18px;
 color:#ffd34e;
 font-weight:bold;
}

#controls{
 position:absolute;
 bottom:20px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 align-items:end;
 padding:0 25px;
 z-index:10;
 pointer-events:none;
}

#joystick{
 width:125px;
 height:125px;
 border-radius:50%;
 background:#ffffff22;
 border:3px solid #ffffff55;
 position:relative;
 pointer-events:auto;
}

#stick{
 position:absolute;
 width:52px;
 height:52px;
 left:34px;
 top:34px;
 border-radius:50%;
 background:#ffffffb0;
}

.buttons{
 display:grid;
 grid-template-columns:repeat(2,70px);
 gap:12px;
 pointer-events:auto;
}

.btn{
 width:70px;
 height:70px;
 border-radius:50%;
 border:2px solid white;
 background:#0755a9dd;
 color:white;
 font-weight:bold;
 font-size:12px;
}

.btn:active{background:#e5a900}

#menu{
 position:absolute;
 inset:0;
 z-index:20;
 background:linear-gradient(135deg,#061d35,#07111c);
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:20px;
}

#menu h1{
 color:#ffcf40;
 font-size:35px;
 margin-bottom:12px;
}

#menu p{
 color:#ddd;
 line-height:1.6;
 margin-bottom:25px;
}

#start{
 background:#e9aa14;
 border:0;
 border-radius:10px;
 padding:16px 45px;
 font-size:18px;
 font-weight:bold;
}

#message{
 position:absolute;
 top:95px;
 left:50%;
 transform:translateX(-50%);
 color:#ffdb5b;
 font-size:25px;
 font-weight:900;
 z-index:8;
}

#restart{
 position:absolute;
 top:15px;
 right:12px;
 z-index:10;
 padding:10px;
 background:#122b45;
 color:white;
 border:1px solid white;
 border-radius:8px;
}

@media(orientation:portrait){
 #menu h1{font-size:27px}
 #controls{padding:0 12px;bottom:12px}
 #joystick{width:105px;height:105px}
 #stick{left:27px;top:27px}
 .btn{width:58px;height:58px}
 .buttons{grid-template-columns:repeat(2,58px)}
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
 <span class="team">BLUE</span>
 <span class="score" id="score">0 - 0</span>
 <span class="team">RED</span>
 <span id="timer">00:00</span>
</div>

<div id="message"></div>

<button id="restart">RESTART</button>

<div id="controls">

 <div id="joystick">
  <div id="stick"></div>
 </div>

 <div class="buttons">
  <button class="btn" id="pass">PASS</button>
  <button class="btn" id="shoot">SHOOT</button>
  <button class="btn" id="sprint">SPRINT</button>
  <button class="btn" id="switch">SWITCH</button>
 </div>

</div>

<div id="menu">
 <h1>⚽ ULTIMATE FOOTBALL 2027</h1>
 <p>
  3D FOOTBALL EXPERIENCE<br>
  Choose your team and enter the stadium.<br>
  Control your players and score goals!
 </p>
 <button id="start">START MATCH</button>
 <p style="margin-top:20px;font-size:12px">
  Designed as an original football game.
 </p>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* SCENE */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9d9);

scene.fog = new THREE.Fog(0x87b9d9,65,150);

const camera = new THREE.PerspectiveCamera(
 60,innerWidth/innerHeight,0.1,300
);

camera.position.set(0,35,48);

const renderer = new THREE.WebGLRenderer({
 antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.getElementById("game").appendChild(renderer.domElement);

/* LIGHTING */

scene.add(new THREE.HemisphereLight(0xffffff,0x365b32,2));

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-25,50,30);
sun.castShadow=true;
scene.add(sun);

/* STADIUM */

const pitchWidth=40;
const pitchLength=65;

const grass=new THREE.Mesh(
 new THREE.PlaneGeometry(pitchWidth,pitchLength),
 new THREE.MeshStandardMaterial({color:0x187a35})
);

grass.rotation.x=-Math.PI/2;
grass.receiveShadow=true;
scene.add(grass);

for(let i=0;i<13;i++){

 const stripe=new THREE.Mesh(
  new THREE.PlaneGeometry(40,5),
  new THREE.MeshBasicMaterial({
   color:i%2===0?0x238b40:0x197534
  })
 );

 stripe.rotation.x=-Math.PI/2;
 stripe.position.set(0,0.015,-30+i*5);
 scene.add(stripe);
}

/* FIELD LINES */

function line(x1,z1,x2,z2){

 const points=[
  new THREE.Vector3(x1,0.06,z1),
  new THREE.Vector3(x2,0.06,z2)
 ];

 const geometry=new THREE.BufferGeometry().setFromPoints(points);

 scene.add(new THREE.Line(
  geometry,
  new THREE.LineBasicMaterial({color:0xffffff})
 ));
}

line(-20,-32.5,20,-32.5);
line(-20,32.5,20,32.5);
line(-20,-32.5,-20,32.5);
line(20,-32.5,20,32.5);
line(-20,0,20,0);

const circle=new THREE.Mesh(
 new THREE.RingGeometry(7.8,8,64),
 new THREE.MeshBasicMaterial({
  color:0xffffff,
  side:THREE.DoubleSide
 })
);

circle.rotation.x=-Math.PI/2;
circle.position.y=0.07;
scene.add(circle);

/* GOALS */

function createGoal(z){

 const group=new THREE.Group();

 const material=new THREE.MeshStandardMaterial({
  color:0xffffff
 });

 function pole(x,y,zpos,sx,sy,sz){

  const m=new THREE.Mesh(
   new THREE.BoxGeometry(sx,sy,sz),
   material
  );

  m.position.set(x,y,zpos);
  group.add(m);
 }

 pole(-4,2,z,0.2,4,0.2);
 pole(4,2,z,0.2,4,0.2);
 pole(0,4,z,8,0.2,0.2);

 scene.add(group);
}

createGoal(-33);
createGoal(33);

/* STADIUM STANDS */

for(let side of [-1,1]){

 const stand=new THREE.Mesh(
  new THREE.BoxGeometry(7,7,75),
  new THREE.MeshStandardMaterial({color:0x263c54})
 );

 stand.position.set(side*25,3.5,0);
 scene.add(stand);
}

for(let z of [-39,39]){

 const stand=new THREE.Mesh(
  new THREE.BoxGeometry(55,7,7),
  new THREE.MeshStandardMaterial({color:0x263c54})
 );

 stand.position.set(0,3.5,z);
 scene.add(stand);
}

/* PLAYERS */

function makePlayer(color,x,z){

 const group=new THREE.Group();

 const shirt=new THREE.Mesh(
  new THREE.CapsuleGeometry(0.65,1.1,4,8),
  new THREE.MeshStandardMaterial({color})
 );

 shirt.position.y=1.5;
 shirt.castShadow=true;
 group.add(shirt);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.38,12,12),
  new THREE.MeshStandardMaterial({color:0xe0ad83})
 );

 head.position.y=2.65;
 group.add(head);

 for(let side of [-1,1]){

  const leg=new THREE.Mesh(
   new THREE.BoxGeometry(0.3,0.9,0.35),
   new THREE.MeshStandardMaterial({color:0x182334})
  );

  leg.position.set(side*0.3,0.45,0);
  group.add(leg);
 }

 group.position.set(x,0,z);

 scene.add(group);

 return group;
}

/* TEAMS */

const blue=[];
const red=[];

const bluePositions=[
 [0,20],[-9,17],[9,17],[-12,7],[12,7],
 [-7,-5],[7,-5],[0,-15]
];

const redPositions=[
 [0,-20],[-9,-17],[9,-17],[-12,-7],[12,-7],
 [-7,5],[7,5],[0,15]
];

bluePositions.forEach((p,i)=>{
 blue.push(makePlayer(0x0874e8,p[0],p[1]));
});

redPositions.forEach((p,i)=>{
 red.push(makePlayer(0xd62d36,p[0],p[1]));
});

let active=blue[0];

/* BALL */

const ball=new THREE.Mesh(
 new THREE.SphereGeometry(0.55,24,24),
 new THREE.MeshStandardMaterial({
  color:0xffffff,
  roughness:0.65
 })
);

ball.position.set(0,0.55,0);
ball.castShadow=true;
scene.add(ball);

let velocity=new THREE.Vector3();

/* GAME VARIABLES */

let scoreBlue=0;
let scoreRed=0;
let elapsed=0;
let playing=false;
let sprinting=false;

const joystick={x:0,y:0};

const scoreElement=document.getElementById("score");
const timerElement=document.getElementById("timer");
const message=document.getElementById("message");

function updateScore(){

 scoreElement.textContent=
 scoreBlue+" - "+scoreRed;
}

function resetBall(){

 ball.position.set(0,0.55,0);
 velocity.set(0,0,0);

 blue.forEach((p,i)=>{
  p.position.set(...bluePositions[i],0);
  p.position.y=0;
 });

 red.forEach((p,i)=>{
  p.position.set(...redPositions[i],0);
  p.position.y=0;
 });

 active=blue[0];
}

/* JOYSTICK */

const joystickElement=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickActive=false;

function joystickMove(e){

 const rect=joystickElement.getBoundingClientRect();

 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const max=42;
 const length=Math.hypot(dx,dy);

 if(length>max){
  dx=dx/length*max;
  dy=dy/length*max;
 }

 joystick.x=dx/max;
 joystick.y=dy/max;

 stick.style.left=(34+dx)+"px";
 stick.style.top=(34+dy)+"px";
}

joystickElement.addEventListener("pointerdown",e=>{
 joystickActive=true;
 joystickElement.setPointerCapture(e.pointerId);
 joystickMove(e);
});

joystickElement.addEventListener("pointermove",e=>{
 if(joystickActive)joystickMove(e);
});

function stopJoystick(){

 joystickActive=false;
 joystick.x=0;
 joystick.y=0;

 stick.style.left="34px";
 stick.style.top="34px";
}

joystickElement.addEventListener("pointerup",stopJoystick);
joystickElement.addEventListener("pointercancel",stopJoystick);

/* KEYBOARD */

const keys={};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

/* SHOOT */

function shoot(){

 if(!playing)return;

 const distance=active.position.distanceTo(ball.position);

 if(distance<3.5){

  const direction=new THREE.Vector3(
   -ball.position.x,
   0,
   -Math.sign(ball.position.z)
  );

  direction.normalize();

  velocity.copy(direction.multiplyScalar(17));
  velocity.y=4;
 }
}

/* PASS */

function pass(){

 if(!playing)return;

 const distance=active.position.distanceTo(ball.position);

 if(distance<3.5){

  const teammate=blue.find(p=>
   p!==active
  );

  const direction=teammate.position.clone()
   .sub(ball.position)
   .normalize();

  velocity.copy(direction.multiplyScalar(12));
 }
}

/* SPRINT */

document.getElementById("sprint")
.addEventListener("pointerdown",()=>sprinting=true);

document.getElementById("sprint")
.addEventListener("pointerup",()=>sprinting=false);

document.getElementById("sprint")
.addEventListener("pointercancel",()=>sprinting=false);

document.getElementById("shoot").addEventListener("click",shoot);
document.getElementById("pass").addEventListener("click",pass);

document.getElementById("switch").addEventListener("click",()=>{

 let nearest=blue
 .filter(p=>p!==active)
 .sort((a,b)=>
  a.position.distanceTo(ball.position)-
  b.position.distanceTo(ball.position)
 )[0];

 if(nearest)active=nearest;
});

/* PLAYER MOVEMENT */

function movePlayer(){

 let x=joystick.x;
 let z=joystick.y;

 if(keys["a"]||keys["arrowleft"])x=-1;
 if(keys["d"]||keys["arrowright"])x=1;
 if(keys["w"]||keys["arrowup"])z=-1;
 if(keys["s"]||keys["arrowdown"])z=1;

 const direction=new THREE.Vector3(x,0,z);

 if(direction.length()>1)direction.normalize();

 const speed=sprinting||keys["shift"]?13:8;

 active.position.x+=direction.x*speed/60;
 active.position.z+=direction.z*speed/60;

 active.position.x=THREE.MathUtils.clamp(
  active.position.x,-19,19
 );

 active.position.z=THREE.MathUtils.clamp(
  active.position.z,-31,31
 );

 if(direction.length()>0.05){

  active.rotation.y=Math.atan2(
   direction.x,direction.z
  );
 }
}

/* BALL MOVEMENT */

function updateBall(){

 const distance=active.position.distanceTo(ball.position);

 if(distance<1.8){

  const direction=new THREE.Vector3(
   joystick.x,0,joystick.y
  );

  if(direction.length()>0.1){

   velocity.x+=direction.x*0.12;
   velocity.z+=direction.z*0.12;

  }else{

   const follow=active.position.clone()
   .sub(ball.position);

   follow.y=0;

   if(follow.length()>0.01){
    velocity.x+=follow.x*0.025;
    velocity.z+=follow.z*0.025;
   }
  }
 }

 ball.position.x+=velocity.x/60;
 ball.position.z+=velocity.z/60;

 velocity.multiplyScalar(0.985);

 ball.position.y=Math.max(
  0.55,
  ball.position.y+velocity.y/60
 );

 if(ball.position.y<=0.56){
  velocity.y=0;
 }else{
  velocity.y-=12/60;
 }

 ball.rotation.x+=velocity.z*0.03;
 ball.rotation.z-=velocity.x*0.03;

 /* FIELD BOUNDARIES */

 if(Math.abs(ball.position.x)>19.5){
  velocity.x*=-0.7;
 }

 if(Math.abs(ball.position.z)>32){

  if(Math.abs(ball.position.x)<4){

   if(ball.position.z<0)scoreBlue++;
   else scoreRed++;

   updateScore();

   message.textContent="GOOOOOAL! ⚽";

   setTimeout(()=>{
    message.textContent="";
   },1800);

   resetBall();

  }else{
   velocity.z*=-0.7;
  }
 }
}

/* OPPONENT AI */

function updateAI(){

 red.forEach((player,i)=>{

  const target=i===0?ball.position:blue[i].position;

  const direction=target.clone()
   .sub(player.position);

  direction.y=0;

  if(direction.length()>1){
   direction.normalize();

   player.position.add(
    direction.multiplyScalar(0.035)
   );
  }

  player.position.x=THREE.MathUtils.clamp(
   player.position.x,-19,19
  );

  player.position.z=THREE.MathUtils.clamp(
   player.position.z,-31,31
  );

  if(player.position.distanceTo(ball.position)<1.5){

   const kick=ball.position.clone()
   .sub(player.position);

   kick.y=0;

   if(kick.length()>0.01){
    kick.normalize();

    velocity.add(
     kick.multiplyScalar(0.18)
    );
   }
  }

 });
}

/* CAMERA */

function updateCamera(){

 const target=active.position;

 const desired=new THREE.Vector3(
  target.x,
  29,
  target.z+35
 );

 camera.position.lerp(desired,0.06);

 camera.lookAt(
  target.x,
  0,
  target.z-3
 );
}

/* TIMER */

function updateTimer(delta){

 elapsed+=delta;

 const minutes=Math.floor(elapsed/60);
 const seconds=Math.floor(elapsed%60);

 timerElement.textContent=
 String(minutes).padStart(2,"0")+":"+
 String(seconds).padStart(2,"0");

}

/* GAME LOOP */

let last=performance.now();

function animate(now){

 requestAnimationFrame(animate);

 const delta=Math.min((now-last)/1000,0.05);
 last=now;

 if(playing){

  movePlayer();
  updateBall();
  updateAI();
  updateCamera();
  updateTimer(delta);

 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

/* START MATCH */

document.getElementById("start")
.addEventListener("click",()=>{

 playing=true;

 document.getElementById("menu").style.display="none";

 elapsed=0;
 scoreBlue=0;
 scoreRed=0;

 updateScore();
 resetBall();

});

/* RESTART */

document.getElementById("restart")
.addEventListener("click",()=>{

 scoreBlue=0;
 scoreRed=0;
 elapsed=0;

 updateScore();
 resetBall();

 message.textContent="MATCH RESTARTED";

 setTimeout(()=>{
  message.textContent="";
 },1500);

});

/* RESPONSIVE SCREEN */

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
