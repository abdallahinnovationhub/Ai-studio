<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ultimate Football 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#071b12;
 font-family:Arial,sans-serif;color:white;touch-action:none
}
canvas{display:block}
#scoreboard{
 position:absolute;top:10px;left:50%;
 transform:translateX(-50%);
 background:#071b16eF;padding:10px 25px;
 border-radius:12px;text-align:center;
 border:1px solid #ffffff55;z-index:5
}
#score{font-size:25px;font-weight:bold}
#timer{font-size:12px;color:#ddd}
#message{
 position:absolute;top:100px;width:100%;
 text-align:center;font-size:24px;
 font-weight:bold;text-shadow:0 2px 5px black;
 pointer-events:none
}
#controls{
 position:absolute;bottom:15px;left:0;right:0;
 display:flex;justify-content:space-between;
 align-items:end;padding:0 18px;z-index:8
}
#joystick{
 width:115px;height:115px;border-radius:50%;
 background:#ffffff22;border:2px solid #ffffff66;
 position:relative
}
#stick{
 width:44px;height:44px;border-radius:50%;
 background:#ffffffcc;position:absolute;
 left:33px;top:33px
}
.buttons{
 display:grid;grid-template-columns:repeat(2,65px);gap:9px
}
button{
 width:65px;height:65px;border-radius:50%;
 border:1px solid #ffffff77;
 background:#102c25eF;color:white;font-weight:bold
}
button:active{background:#d4a51c;color:black}
#top{
 position:absolute;right:8px;top:75px;
 z-index:10;display:flex;gap:5px
}
#top button{
 width:auto;height:35px;border-radius:7px;padding:0 10px
}
#start{
 position:absolute;inset:0;z-index:20;
 background:#03140ff2;
 display:flex;align-items:center;
 justify-content:center;padding:15px
}
.panel{
 background:#123327;border:1px solid #ffffff55;
 border-radius:18px;padding:25px;
 width:100%;max-width:400px;text-align:center
}
.panel h1{color:#edc84b}
.panel button{
 width:100%;height:48px;border-radius:8px;
 margin-top:15px;background:#edc84b;color:#111
}
select{
 width:100%;padding:12px;margin:8px 0;
 border-radius:7px
}
#instructions{
 position:absolute;bottom:140px;left:8px;
 background:#0009;padding:7px;border-radius:7px;
 font-size:10px
}
</style>
</head>

<body>

<div id="scoreboard">
 <div id="score">BLUE 0 - 0 RED</div>
 <div id="timer">00:00 | FIRST HALF</div>
</div>

<div id="message">ULTIMATE FOOTBALL 3D</div>

<div id="top">
 <button onclick="pauseGame()">PAUSE</button>
 <button onclick="location.reload()">RESTART</button>
</div>

<div id="instructions">
 MOVE: Joystick / WASD<br>
 PASS: Pass button<br>
 SHOOT: Shoot button<br>
 RUN: Sprint button<br>
 SWITCH: Change player
</div>

<div id="controls">
 <div id="joystick"><div id="stick"></div></div>
 <div class="buttons">
  <button id="pass">PASS</button>
  <button id="shoot">SHOOT</button>
  <button id="run">SPRINT</button>
  <button id="switch">SWITCH</button>
 </div>
</div>

<div id="start">
 <div class="panel">
  <h1>ULTIMATE FOOTBALL 3D</h1>
  <p>Welcome to your football stadium.</p>

  <select id="team">
   <option value="blue">BLUE UNITED</option>
   <option value="red">RED UNITED</option>
  </select>

  <select id="formation">
   <option value="433">4-3-3 Formation</option>
   <option value="442">4-4-2 Formation</option>
   <option value="352">3-5-2 Formation</option>
  </select>

  <button onclick="startMatch()">START MATCH</button>

  <p style="font-size:11px;color:#ccc">
   Rotate your phone to landscape mode.
   Internet connection is required.
  </p>
 </div>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

// ---------------- SCENE ----------------

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d3);
scene.fog=new THREE.Fog(0x91b9d3,100,210);

const camera=new THREE.PerspectiveCamera(
 55,innerWidth/innerHeight,.1,300
);
camera.position.set(0,24,35);

const renderer=new THREE.WebGLRenderer({
 antialias:true,alpha:false
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------------- LIGHTING ----------------

scene.add(new THREE.HemisphereLight(0xffffff,0x314b2c,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2.5);
sunlight.position.set(-35,60,35);
sunlight.castShadow=true;
sunlight.shadow.mapSize.set(2048,2048);
scene.add(sunlight);

// ---------------- MATERIALS ----------------

function material(color,roughness=.8){
 return new THREE.MeshStandardMaterial({
  color,roughness
 });
}

const grass=material(0x167536);
const white=material(0xffffff);
const dark=material(0x171717);
const skin=material(0xb77a50);
const blue=material(0x075ce0);
const red=material(0xd51c27);
const blueShorts=material(0x142c72);
const redShorts=material(0x72141b);
const goalkeeperGreen=material(0x16a65c);

// ---------------- FIELD ----------------

function createBox(w,h,d,mat,x,y,z){
 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 obj.position.set(x,y,z);
 obj.castShadow=true;
 obj.receiveShadow=true;
 scene.add(obj);
 return obj;
}

createBox(74,.3,112,grass,0,-.2,0);

function fieldLine(x1,z1,x2,z2){
 const dx=x2-x1;
 const dz=z2-z1;
 const length=Math.hypot(dx,dz);

 const obj=new THREE.Mesh(
  new THREE.BoxGeometry(.13,.04,length),white
 );

 obj.position.set((x1+x2)/2,.02,(z1+z2)/2);
 obj.rotation.y=Math.atan2(dx,dz);
 scene.add(obj);
}

fieldLine(-35,-53,35,-53);
fieldLine(-35,53,35,53);
fieldLine(-35,-53,-35,53);
fieldLine(35,-53,35,53);
fieldLine(-35,0,35,0);

const centreCircle=new THREE.Mesh(
 new THREE.RingGeometry(9.8,10,80),white
);
centreCircle.rotation.x=-Math.PI/2;
centreCircle.position.y=.03;
scene.add(centreCircle);

function penaltyArea(z){
 const sign=Math.sign(z);
 fieldLine(-20,z,20,z);
 fieldLine(-20,z,-20,z+sign*16);
 fieldLine(20,z,20,z+sign*16);
 fieldLine(-20,z+sign*16,20,z+sign*16);
}
penaltyArea(-53);
penaltyArea(53);

// ---------------- STADIUM ----------------

const stand=material(0x354858);
const seats=material(0x8799a8);

for(const side of [-1,1]){
 for(let row=0;row<6;row++){
  createBox(
   85,2,2.5,stand,0,
   2+row*1.3,side*(59+row*2)
  );
 }
 createBox(2,9,120,stand,side*41,4,0);
}

for(let i=0;i<18;i++){
 const x=-40+i*4.7;
 createBox(2,2,1,seats,x,6,64);
 createBox(2,2,1,seats,x,6,-64);
}

// ---------------- GOALS ----------------

function makeGoal(z){
 const group=new THREE.Group();

 const post1=new THREE.Mesh(
  new THREE.CylinderGeometry(.15,.15,5,12),white
 );
 const post2=post1.clone();

 post1.position.set(-4,2.5,0);
 post2.position.set(4,2.5,0);

 const crossbar=new THREE.Mesh(
  new THREE.BoxGeometry(8,.2,.2),white
 );
 crossbar.position.y=5;

 group.add(post1,post2,crossbar);
 group.position.z=z;
 scene.add(group);
}

makeGoal(-53);
makeGoal(53);

// ---------------- BALL ----------------

const ball=new THREE.Mesh(
 new THREE.SphereGeometry(.48,24,20),
 material(0xffffff,.35)
);
ball.position.set(0,.5,0);
ball.castShadow=true;
scene.add(ball);

const ballPatch=new THREE.Mesh(
 new THREE.IcosahedronGeometry(.49,1),
 dark
);
ballPatch.scale.set(.28,.28,.28);
ball.add(ballPatch);

const ballVelocity=new THREE.Vector3();

// ---------------- HUMAN PLAYER MODEL ----------------

function createPlayer(team,x,z,number,isKeeper=false){

 const player=new THREE.Group();

 const shirt=isKeeper?
 goalkeeperGreen:(team==="blue"?blue:red);

 const shorts=team==="blue"?blueShorts:redShorts;

 function bodyPart(geometry,mat,x,y,z){
  const obj=new THREE.Mesh(geometry,mat);
  obj.position.set(x,y,z);
  obj.castShadow=true;
  player.add(obj);
  return obj;
 }

 // Torso
 bodyPart(
  new THREE.CapsuleGeometry(.43,.65,5,10),
  shirt,0,2.15,0
 );

 // Neck and head
 bodyPart(
  new THREE.CylinderGeometry(.14,.17,.23,10),
  skin,0,2.75,0
 );

 bodyPart(
  new THREE.SphereGeometry(.32,18,14),
  skin,0,3.12,0
 );

 // Hair
 const hair=bodyPart(
  new THREE.SphereGeometry(.33,12,8),
  dark,0,3.3,0
 );
 hair.scale.set(1,.45,1);

 const arms=[];
 const legs=[];

 for(const side of [-1,1]){

  // Arms
  const arm=new THREE.Group();
  arm.position.set(side*.48,2.45,0);

  const upper=new THREE.Mesh(
   new THREE.CylinderGeometry(.13,.17,.48,10),shirt
  );
  upper.position.y=-.28;
  arm.add(upper);

  const forearm=new THREE.Mesh(
   new THREE.CylinderGeometry(.11,.13,.48,10),skin
  );
  forearm.position.y=-.72;
  arm.add(forearm);

  player.add(arm);
  arms.push(arm);

  // Legs
  const leg=new THREE.Group();
  leg.position.set(side*.22,1.55,0);

  const thigh=new THREE.Mesh(
   new THREE.CylinderGeometry(.2,.16,.62,10),shorts
  );
  thigh.position.y=-.3;
  leg.add(thigh);

  const shin=new THREE.Mesh(
   new THREE.CylinderGeometry(.13,.15,.65,10),skin
  );
  shin.position.y=-.88;
  leg.add(shin);

  const shoe=new THREE.Mesh(
   new THREE.BoxGeometry(.27,.15,.42),dark
  );
  shoe.position.set(0,-1.23,.12);
  leg.add(shoe);

  player.add(leg);
  legs.push(leg);
 }

 player.position.set(x,0,z);

 player.userData={
  team,number,isKeeper,legs,arms,
  homeX:x,homeZ:z
 };

 scene.add(player);
 return player;
}

// ---------------- FORMATIONS ----------------

function formationPositions(type){

 if(type==="442"){
  return [
   [-26,-32],[-9,-34],[9,-34],[26,-32],
   [-26,-19],[-9,-19],[9,-19],[26,-19],
   [-12,-7],[12,-7],[0,-46]
  ];
 }

 if(type==="352"){
  return [
   [-19,-32],[0,-35],[19,-32],
   [-28,-20],[-14,-19],[0,-19],[14,-19],[28,-20],
   [-11,-7],[11,-7],[0,-46]
  ];
 }

 return [
  [-26,-32],[-9,-34],[9,-34],[26,-32],
  [-18,-19],[0,-20],[18,-19],
  [-26,-7],[0,-6],[26,-7],[0,-46]
 ];
}

const teamBlue=[];
const teamRed=[];

let userTeam=[];
let enemyTeam=[];
let selectedPlayer=null;

function buildTeams(){

 const formation=document.getElementById("formation").value;
 const positions=formationPositions(formation);

 const selected=document.getElementById("team").value;

 for(let i=0;i<11;i++){

  const p=positions[i];

  const a=createPlayer(
   "blue",p[0],p[1],i+1,i===10
  );

  const b=createPlayer(
   "red",-p[0],-p[1],i+1,i===10
  );

  teamBlue.push(a);
  teamRed.push(b);
 }

 userTeam=selected==="blue"?teamBlue:teamRed;
 enemyTeam=selected==="blue"?teamRed:teamBlue;

 selectedPlayer=userTeam[8];
}

// ---------------- MATCH STATE ----------------

let started=false;
let paused=false;
let seconds=0;
let blueScore=0;
let redScore=0;

function startMatch(){
 buildTeams();
 started=true;

 document.getElementById("start").style.display="none";
 showMessage("KICK OFF!");

 setTimeout(()=>showMessage(""),2000);
}

function showMessage(text){
 document.getElementById("message").textContent=text;
}

function pauseGame(){
 if(!started)return;
 paused=!paused;
 showMessage(paused?"MATCH PAUSED":"");
}

// ---------------- CONTROLS ----------------

let joyX=0;
let joyY=0;
let sprint=false;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

joystick.addEventListener("pointerdown",e=>{
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});

joystick.addEventListener("pointermove",e=>{
 if(e.buttons)moveStick(e);
});

function moveStick(e){
 const r=joystick.getBoundingClientRect();

 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);

 const max=35;
 const length=Math.hypot(x,y);

 if(length>max){
  x=x/length*max;
  y=y/length*max;
 }

 joyX=x/max;
 joyY=y/max;

 stick.style.left=(35+x)+"px";
 stick.style.top=(35+y)+"px";
}

function releaseStick(){
 joyX=0;
 joyY=0;
 stick.style.left="33px";
 stick.style.top="33px";
}

joystick.addEventListener("pointerup",releaseStick);
joystick.addEventListener("pointercancel",releaseStick);

document.getElementById("run").addEventListener(
 "pointerdown",()=>sprint=true
);
document.getElementById("run").addEventListener(
 "pointerup",()=>sprint=false
);
document.getElementById("run").addEventListener(
 "pointercancel",()=>sprint=false
);

const keys={};

window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==="Shift")sprint=true;
});

window.addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.key==="Shift")sprint=false;
});

// ---------------- PLAYER SWITCH ----------------

function switchPlayer(){

 let closest=null;
 let best=Infinity;

 userTeam.forEach(p=>{
  if(p.userData.isKeeper)return;

  const d=p.position.distanceTo(ball.position);

  if(d<best){
   best=d;
   closest=p;
  }
 });

 if(closest)selectedPlayer=closest;
}

document.getElementById("switch").onclick=switchPlayer;

// ---------------- BALL KICKING ----------------

function kickBall(power){

 if(!selectedPlayer)return;

 if(selectedPlayer.position.distanceTo(ball.position)>4)return;

 const direction=new THREE.Vector3(
  Math.sin(selectedPlayer.rotation.y),
  0,
  Math.cos(selectedPlayer.rotation.y)
 );

 ballVelocity.set(
  direction.x*power,
  power*.18,
  direction.z*power
 );
}

document.getElementById("shoot").onclick=()=>{
 kickBall(24);
};

document.getElementById("pass").onclick=()=>{
 kickBall(12);
};

// ---------------- PLAYER ANIMATIONS ----------------

function animatePlayer(player,speed){

 const d=player.userData;
 const swing=Math.sin(performance.now()*.012)*.65*speed;

 d.legs[0].rotation.x=swing;
 d.legs[1].rotation.x=-swing;

 d.arms[0].rotation.x=-swing*.6;
 d.arms[1].rotation.x=swing*.6;
}

function moveTowards(player,target,speed,dt){

 const direction=new THREE.Vector3(
  target.x-player.position.x,
  0,
  target.z-player.position.z
 );

 const distance=direction.length();

 if(distance>.2){

  direction.normalize();

  player.position.addScaledVector(
   direction,Math.min(distance,speed*dt)
  );

  player.rotation.y=Math.atan2(
   direction.x,direction.z
  );

  animatePlayer(player,Math.min(speed/7,1));
 }
}

// ---------------- AI ----------------

function updateAI(dt){

 const playerGoal=document.getElementById("team").value==="blue"?
 -53:53;

 const enemyGoal=-playerGoal;

 // Opponents
 enemyTeam.forEach(p=>{

  const d=p.userData;

  if(d.isKeeper){

   const target=new THREE.Vector3(
    THREE.MathUtils.clamp(ball.position.x,-3,3),
    0,enemyGoal*.94
   );

   moveTowards(p,target,3,dt);
   return;
  }

  const distance=p.position.distanceTo(ball.position);

  if(distance<24){
   moveTowards(p,ball.position,5,dt);

   if(distance<2){
    ballVelocity.z+=Math.sign(playerGoal)*5*dt;
   }
  }else{
   moveTowards(
    p,new THREE.Vector3(d.homeX,d.homeZ,0),2,dt
   );
  }
 });

 // Teammates
 userTeam.forEach(p=>{

  if(p===selectedPlayer)return;

  const d=p.userData;

  if(d.isKeeper){

   const target=new THREE.Vector3(
    THREE.MathUtils.clamp(ball.position.x,-3,3),
    0,-playerGoal*.94
   );

   moveTowards(p,target,3,dt);
   return;
  }

  const target=new THREE.Vector3(d.homeX,d.homeZ,0);

  if(p.position.distanceTo(ball.position)<16){
   target.x=ball.position.x*.4+d.homeX*.6;
   target.z=ball.position.z*.4+d.homeZ*.6;
  }

  moveTowards(p,target,2.5,dt);
 });
}

// ---------------- BALL PHYSICS ----------------

function updateBall(dt){

 ball.position.addScaledVector(ballVelocity,dt);

 ballVelocity.y-=16*dt;

 if(ball.position.y<.48){
  ball.position.y=.48;
  ballVelocity.y=Math.abs(ballVelocity.y)*.32;

  if(ballVelocity.y<1)ballVelocity.y=0;
 }

 ballVelocity.multiplyScalar(Math.pow(.985,dt*60));

 ball.position.x=THREE.MathUtils.clamp(
  ball.position.x,-37,37
 );

 ball.rotation.x+=ballVelocity.z*dt;
 ball.rotation.z-=ballVelocity.x*dt;

 // Basic goalkeeper interception
 [...teamBlue,...teamRed].forEach(p=>{

  if(!p.userData.isKeeper)return;

  const distance=p.position.distanceTo(ball.position);

  if(distance<1.8){
   ballVelocity.z*=-.65;
   ballVelocity.x+=(Math.random()-.5)*5;
   ball.position.y=Math.max(ball.position.y,1);
  }
 });

 // Goal detection
 if(Math.abs(ball.position.z)>53&&Math.abs(ball.position.x)<4){

  if(ball.position.z<0)redScore++;
  else blueScore++;

  document.getElementById("score").textContent=
   "BLUE "+blueScore+" - "+redScore+" RED";

  showMessage("GOOOOOAL!");

  ball.position.set(0,.5,0);
  ballVelocity.set(0,0,0);

  setTimeout(()=>showMessage(""),2200);
 }

 if(Math.abs(ball.position.z)>58){
  ball.position.set(0,.5,0);
  ballVelocity.set(0,0,0);
 }
}

// ---------------- GAME UPDATE ----------------

function update(dt){

 if(!started||paused)return;

 seconds+=dt;

 const minutes=Math.floor(seconds/60);
 const secs=Math.floor(seconds%60);

 document.getElementById("timer").textContent=
  String(minutes).padStart(2,"0")+":"+
  String(secs).padStart(2,"0")+" | FIRST HALF";

 // Keyboard and joystick
 let x=joyX;
 let z=joyY;

 if(keys.w)z-=1;
 if(keys.s)z+=1;
 if(keys.a)x-=1;
 if(keys.d)x+=1;

 const length=Math.hypot(x,z);

 if(length>1){
  x/=length;
  z/=length;
 }

 if(selectedPlayer){

  const speed=sprint?12:7;

  selectedPlayer.position.x+=x*speed*dt;
  selectedPlayer.position.z+=z*speed*dt;

  selectedPlayer.position.x=THREE.MathUtils.clamp(
   selectedPlayer.position.x,-33,33
  );

  selectedPlayer.position.z=THREE.MathUtils.clamp(
   selectedPlayer.position.z,-51,51
  );

  if(Math.abs(x)+Math.abs(z)>.05){
   selectedPlayer.rotation.y=Math.atan2(x,z);
   animatePlayer(selectedPlayer,Math.min(speed/7,1));
  }

  // Dribbling
  if(selectedPlayer.position.distanceTo(ball.position)<2.5){

   const forward=new THREE.Vector3(
    Math.sin(selectedPlayer.rotation.y),
    0,
    Math.cos(selectedPlayer.rotation.y)
   );

   const target=selectedPlayer.position.clone()
    .addScaledVector(forward,1.35);

   ball.position.lerp(target,Math.min(1,dt*9));
  }
 }

 updateAI(dt);
 updateBall(dt);

 // Camera follows player
 if(selectedPlayer){

  const targetCamera=new THREE.Vector3(
   selectedPlayer.position.x,
   21,
   selectedPlayer.position.z+30
  );

  camera.position.lerp(targetCamera,Math.min(1,dt*2.5));

  camera.lookAt(
   selectedPlayer.position.x,
   0,
   selectedPlayer.position.z-5
  );
 }
}

// ---------------- RENDER LOOP ----------------

let previous=0;

function animate(time){

 requestAnimationFrame(animate);

 const dt=Math.min((time-previous)/1000||0,.04);
 previous=time;

 update(dt);
 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// ---------------- SCREEN SIZE ----------------

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
